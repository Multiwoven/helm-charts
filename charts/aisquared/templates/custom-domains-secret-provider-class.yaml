{{ if and .Values.customDomains.enabled .Values.secretsStore.customDomainsSecretEnabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "chart.fullname" . }}-secret-provider-class-custom-domains
  namespace: {{ .Values.kubernetesNamespace }}
  labels:
    app: {{ printf "%s-secret-provider-class-custom-domains" (include "chart.fullname" .) | trunc 63 | trimSuffix "-" }}
    io.kompose.service: {{ printf "%s-secret-provider-class-custom-domains" (include "chart.fullname" .) | trunc 63 | trimSuffix "-" }}
    {{- include "chart.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secretsStore.secretRegion }}
    objects: |
      - objectName: {{ required "customDomainsCredsSecretName is required" .Values.secretsStore.customDomainsCredsSecretName }}
        objectType: secretsmanager
        jmesPath:
          - path: apiKey
            objectAlias: CUSTOM_DOMAINS_API_KEY
          - path: railsWebhookSecret
            objectAlias: CUSTOM_DOMAINS_RAILS_WEBHOOK_SECRET
          - path: dbUsername
            objectAlias: CUSTOM_DOMAINS_DB_USERNAME
          - path: dbPassword
            objectAlias: CUSTOM_DOMAINS_DB_PASSWORD
  secretObjects:
  - secretName: {{ .Values.secretsStore.customDomainsSecretAlias }}
    type: Opaque
    data:
      - objectName: CUSTOM_DOMAINS_API_KEY
        key: CUSTOM_DOMAINS_API_KEY
      - objectName: CUSTOM_DOMAINS_RAILS_WEBHOOK_SECRET
        key: CUSTOM_DOMAINS_RAILS_WEBHOOK_SECRET
      - objectName: CUSTOM_DOMAINS_DB_USERNAME
        key: CUSTOM_DOMAINS_DB_USERNAME
      - objectName: CUSTOM_DOMAINS_DB_PASSWORD
        key: CUSTOM_DOMAINS_DB_PASSWORD
{{ end }}
