# Box ServiceAccount
# Dedicated service account for the box orchestrator.
# This is intentionally separate from the shared multiwoven service account
# because box carries elevated RBAC permissions (pod/PVC/secret management)
# in the sandbox and releases namespaces. Its IAM annotation (box.serviceAccount.annotations)
# is deliberately separate from the main serviceAccount.annotations too, for
# the same reason -- box's AWS access should be scoped to its own secret
# only, not inherit the main app's broader dev-multiwoven/* read access.
# Enabled via box.enabled. Disabled by default.
{{- if .Values.box.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-box-controller
  namespace: {{ .Values.kubernetesNamespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- if .Values.box.serviceAccount.annotations }}
  annotations:
    {{- range $key, $value := .Values.box.serviceAccount.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- end }}
